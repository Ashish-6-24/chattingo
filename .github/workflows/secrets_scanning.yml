# Goal: To scan the code for tokens, secrets, API Keys or any leaked Passwords so that if found we can quickly rotate the exposed tokens/keys/etc .

name: Secrets Scanning

# Resusable workflow which can be called easily whenever needed
on:
  workflow_call:

jobs:
  secrets_scanning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # from the very first commit pull all the code .

      - name: Better Leaks Scanner
      - uses: dortort/betterleaks-action@v0.1.0
        env:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          with:
          config: .github/workflows/.betterleaks.toml
#          continue-on-error: true 

