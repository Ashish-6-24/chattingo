name: Docker Scan

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  docker-security:
    name: Docker Security (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        target: [backend, frontend]

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Dockerfile static analysis
      - name: Hadolint Dockerfile Scan
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./${{ matrix.target }}/Dockerfile
          failure-threshold: error
          no-fail: false

      # Configure Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build image locally for security scanning
      - name: Build Local Image for Scanning
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.target }}
          file: ./${{ matrix.target }}/Dockerfile
          load: true
          tags: ${{ matrix.target }}-test:${{ github.sha }}

          # Keep backend and frontend caches separate.
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      # Scan the built image for vulnerabilities
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.target }}-test:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"
          hide-progress: true

      # Upload findings even when Trivy detects vulnerabilities.
      - name: Upload Trivy Results to GitHub Security
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image-${{ matrix.target }}
