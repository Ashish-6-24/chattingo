
name: Build and Push Images

on:
  workflow_call:
    outputs:
      image_tag:
        description: "Short Git SHA used to tag the built images"
        value: ${{ jobs.build-and-push.outputs.image_tag }}

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & Push (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - app: backend
            context: ./backend
            file: ./backend/Dockerfile
            image: ashish0624/chattingo-backend

          - app: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
            image: ashish0624/chattingo-frontend

    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Generate Image Tag
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ steps.tag.outputs.tag }}
            ${{ matrix.image }}:latest
          cache-from: type=gha,scope=chattingo-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=chattingo-${{ matrix.app }}
