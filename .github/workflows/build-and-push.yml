name: Build and Push Images

on:
  workflow_call:
    outputs:
      image_tag:
        description: "Short git SHA used to tag the built images"
        value: ${{ jobs.build-and-push.outputs.image_tag }}

permissions:
  contents: read

env:
  BACKEND_IMAGE: ashish0624/chattingo-backend
  FRONTEND_IMAGE: ashish0624/chattingo-frontend

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 25

    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      # Checkout source code
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Generate immutable image tag
      - name: Set Image Tag
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Configure Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      #  Authenticate with Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and push backend image
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=chattingo-backend
          cache-to: type=gha,mode=max,scope=chattingo-backend

      #  Build and push frontend image
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=chattingo-frontend
          cache-to: type=gha,mode=max,scope=chattingo-frontend
