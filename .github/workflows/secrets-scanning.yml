# Goal: To scan the code for tokens, secrets, API Keys or any leaked Passwords so that if found we can quickly rotate the exposed tokens/keys/etc .
name: Secrets Scanning

# Reusable workflow which can be called easily whenever needed
on:
  workflow_call:

jobs:
  secrets_scanning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # From the very first commit pull all the code

      - name: Better Leaks Scanner
        uses: dortort/betterleaks-action@v0.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          config: '.github/.betterleaks.toml'

      - name: Upload BetterLeaks Report
        if: always() # upload even when the scanner fails because it finds secrets
        uses: actions/upload-artifact@v7.0.2
        with:
          name: betterleaks-report
          path: betterleaks-report.sarif
          if-no-files-found: warn # Avoids hiding the original scan result if the report wasn't generated
          retention-days: 14 # Keeps the artifact available for investigation without retaining it indefinitely
