# Goal: To call the workflows in the order to implement shift left
name: DevSecOps Pipeline

on:
  push:
    branches:
      - main

# CI Pipeline Jobs
jobs:
  # Code Quality
  code_quality:
    uses: ./.github/workflows/code_quality.yml
    secrets: inherit
  # Secrets Scanning
  secrets_scanning:
    uses: ./.github/workflows/secrets-scanning.yml
    secrets: inherit
