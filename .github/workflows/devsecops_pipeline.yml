name: DevSecOps Pipeline

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  secrets_scanning:
    uses: ./.github/workflows/secrets-scanning.yml
    secrets: inherit

  code_quality:
    uses: ./.github/workflows/code_quality.yml
    secrets: inherit

  dependency_check:
    uses:  ./.github/workflows/dependency-checks.yml

  docker_build_and_push:
    uses: ./.github/workflows/build-and-push.yml
    secrets: inherit

  docker_scan:
    uses: ./.github/workflows/docker-scan.yml


