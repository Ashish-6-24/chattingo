
name: Code Quality

on:
  workflow_call:
    secrets:
      SEMGREP_APP_TOKEN:
        required: false

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:

  # ---------------- BACKEND QUALITY + SAST ----------------

  backend:
    name: backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    container:
      image: semgrep/semgrep:1.182.1

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Compile and Run SpotBugs
        continue-on-error: true
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp compile \
            com.github.spotbugs:spotbugs-maven-plugin:4.8.6.0:check

      - name: Run Semgrep SAST - Java
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/java \
            --config p/security-audit \
            --sarif \
            --output semgrep-backend.sarif \
            .

      - name: Upload Backend SAST Results
        if: ${{ always() && hashFiles('backend/semgrep-backend.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: backend/semgrep-backend.sarif
          category: semgrep-backend


  # ---------------- FRONTEND QUALITY + SAST ----------------

  frontend:
    name: frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    container:
      image: semgrep/semgrep:1.182.1

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js (22)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit --legacy-peer-deps

      - name: ESLint Check
        continue-on-error: true
        run: npx --no-install eslint src --max-warnings=0

      - name: Run Semgrep SAST - React
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/javascript \
            --config p/react \
            --sarif \
            --output semgrep-frontend.sarif \
            .

      - name: Upload Frontend SAST Results
        if: ${{ always() && hashFiles('frontend/semgrep-frontend.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: frontend/semgrep-frontend.sarif
          category: semgrep-frontend

      - name: Build Frontend
        run: npm run build
