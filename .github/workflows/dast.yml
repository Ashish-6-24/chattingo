
name: DAST Scan

on:
  workflow_call:
    inputs:
      image_tag:
        description: "Git SHA tag of the application images"
        required: true
        type: string

  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast_dast:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      BACKEND_IMAGE: ashish0624/chattingo-backend
      FRONTEND_IMAGE: ashish0624/chattingo-frontend
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Generate CI Credentials
        run: |
          {
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 32)"
            echo "MYSQL_PASSWORD=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"

          {
            echo "MYSQL_DATABASE=chattingo_db"
            echo "MYSQL_USER=chattingo_ci"
            echo "SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/chattingo_db?createDatabaseIfNotExist=true"
          } >> "$GITHUB_ENV"

      - name: Start Chattingo Using Prebuilt Images
        run: |
          docker compose -f docker-compose.dast.yml up -d

      - name: Wait for Application
        run: |
          timeout 120s bash -c \
            'until curl -fsS http://localhost:80/ >/dev/null; do sleep 2; done'

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:80'
          fail_action: true
          allow_issue_writing: false

      - name: Cleanup Containers
        if: always()
        run: |
          docker compose -f docker-compose.dast.yml down \
            --volumes --remove-orphans || true
