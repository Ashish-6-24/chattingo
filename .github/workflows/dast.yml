
name: DAST Scan

on:
  workflow_call:

permissions:
  contents: read

jobs:
  OWASP_ZAP_DAST_Scan:
    name: OWASP ZAP Scan
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # ---------------- CHECKOUT ----------------

      - name: Checkout Repository
        uses: actions/checkout@v7

      # ---------------- START APPLICATION ----------------

      - name: Start Chattingo Services
        run: |
          docker compose up -d --build

      # ---------------- HEALTH CHECK ----------------

      - name: Wait for Chattingo to be Healthy
        run: |
          echo "Waiting for Chattingo frontend..."

          timeout 180s bash -c '
            until curl -fsS http://localhost:8080/ > /dev/null; do
              echo "Waiting for application..."
              sleep 5
            done
          '

          echo "Chattingo frontend is reachable."

      # ---------------- OWASP ZAP ----------------

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://host.docker.internal:8080
          fail_action: false
          allow_issue_writing: false

      # ---------------- DIAGNOSTICS ----------------

      - name: Collect Container Logs
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=100

      # ---------------- CLEANUP ----------------

      - name: Stop Chattingo Services
        if: always()
        run: |
          docker compose down -v --remove-orphans
