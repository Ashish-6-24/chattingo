
name: DAST Scan

on:
  workflow_call:

permissions:
  contents: read

jobs:
  OWASP_ZAP_DAST_Scan:
    name: OWASP ZAP Scan
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Disposable CI-only credentials
    env:
      MYSQL_ROOT_PASSWORD: ci-root-password
      MYSQL_DATABASE: chattingo_ci
      MYSQL_USER: chattingo_ci
      MYSQL_PASSWORD: ci-app-password
      JWT_SECRET: ci-only-jwt-secret-change-before-production
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/chattingo_ci?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

    steps:
      # ---------------- CHECKOUT ----------------

      - name: Checkout Repository
        uses: actions/checkout@v7

      # ---------------- VALIDATE CONFIGURATION ----------------

      - name: Validate Docker Compose
        run: docker compose config --quiet

      # ---------------- START APPLICATION ----------------

      - name: Start Chattingo
        run: docker compose up -d --build

      # ---------------- HEALTH CHECK ----------------

      - name: Wait for Chattingo Frontend
        id: readiness
        continue-on-error: true
        run: |
          echo "Waiting for Chattingo frontend..."

          timeout 180s bash -c '
            until curl --fail --silent --show-error \
              http://127.0.0.1/ > /dev/null; do
              echo "Waiting for frontend..."
              sleep 5
            done
          '

          echo "Chattingo frontend is reachable."

      # ---------------- APPLICATION DIAGNOSTICS ----------------

      - name: Collect Application Diagnostics
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=150

      # ---------------- OWASP ZAP BASELINE SCAN ----------------

      - name: OWASP ZAP Baseline Scan
        id: zap
        if: steps.readiness.outcome == 'success'
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://127.0.0.1/
          fail_action: false
          allow_issue_writing: false

      # ---------------- REPORT DAST STATUS ----------------

      - name: Report DAST Status
        if: always()
        run: |
          if [[ "${{ steps.readiness.outcome }}" != "success" ]]; then
            echo "::warning::Chattingo did not become reachable."
            echo "::warning::OWASP ZAP scan was skipped."
            echo "::warning::Review application and Docker Compose logs."

          elif [[ "${{ steps.zap.outcome }}" != "success" ]]; then
            echo "::warning::OWASP ZAP did not complete successfully."
            echo "::warning::Review ZAP execution logs and reports."

          else
            echo "OWASP ZAP baseline scan completed."
          fi

      # ---------------- CLEANUP ----------------

      - name: Stop Chattingo
        if: always()
        run: |
          docker compose down --volumes --remove-orphans
