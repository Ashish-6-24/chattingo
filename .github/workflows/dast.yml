name: DAST Scan

on:
  workflow_call:

jobs:
  OWASP_ZAP_DAST_Scan:
    name: OWASP ZAP Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ---------------- APPLICATION HEALTH CHECK ----------------

      - name: Wait for Chattingo to be Healthy
        env:
          TARGET_URL: ${{ secrets.CHATTINGO_URL }}
        run: |
          if [[ -z "$TARGET_URL" ]]; then
            echo "::error::CHATTINGO_URL secret is missing"
            exit 1
          fi

          timeout 120s bash -c '
            until curl -fsSL --max-time 10 "$TARGET_URL/" > /dev/null; do
              echo "Waiting for Chattingo..."
              sleep 5
            done
          '

      # ---------------- OWASP ZAP BASELINE SCAN ----------------

      - name: OWASP ZAP Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ secrets.CHATTINGO_URL }}
          fail_action: false
          allow_issue_writing: false
