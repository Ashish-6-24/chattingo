
name: DAST Scan

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

  # # Run a baseline security scan weekly
  # schedule:
  #   - cron: '0 2 * * 1'

# Cancel redundant workflow runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast_dast:
    name: Fast Baseline DAST Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ---------------- CHECKOUT ----------------

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      # ---------------- START APPLICATION ----------------

      - name: Build and Start Chattingo
        run: |
          export JWT_SECRET="$(openssl rand -hex 32)"
          export MYSQL_ROOT_PASSWORD="$(openssl rand -hex 32)"
          export MYSQL_PASSWORD="$(openssl rand -hex 32)"
          export MYSQL_DATABASE="chattingo_db"
          export MYSQL_USER="chattingo_ci"
          export SPRING_DATASOURCE_URL="jdbc:mysql://mysql:3306/chattingo_db?createDatabaseIfNotExist=true"

          docker compose up --build -d

      # ---------------- APPLICATION HEALTH CHECK ----------------

      - name: Wait for App to be Ready
        run: |
          timeout 180s bash -c \
            'until curl -fsS http://localhost:80/ > /dev/null; do sleep 2; done'

      # ---------------- OWASP ZAP BASELINE SCAN ----------------

      - name: Get Docker Gateway IP
        id: gateway
        run: |
          IP=$(ip -4 -o addr show docker0 | awk '{split($4,a,"/"); print a[1]}')

          echo "ip=$IP" >> "$GITHUB_OUTPUT"

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://${{ steps.gateway.outputs.ip }}:80'
          fail_action: true
          allow_issue_writing: false

      # ---------------- CLEANUP ----------------

      - name: Stop Application Containers
        if: always()
        run: docker compose down --volumes --remove-orphans || true
